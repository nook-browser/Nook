[package]
name = "nook_adblock"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
# content-blocking is off by default; it is the filter-to-WKContentRuleList
# converter Brave wrote for Brave iOS. css-validation is deliberately not
# enabled: it pulls cssparser and selectors, and nothing here validates selectors.
adblock = { version = "0.13.3", features = ["content-blocking"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
strip = true
