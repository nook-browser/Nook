name: macOS Build, Sign, Notarize & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-sign-notarize:
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version info
        run: |
          # The tag names the release: vX.Y.Z is official, vX.Y.Z-beta.N is a beta. The
          # marketing version comes from the tag so the app's own version string says beta;
          # the build number stays in the project and must be bumped for every tag.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="v$(grep 'MARKETING_VERSION' Nook.xcodeproj/project.pbxproj \
              | head -n1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          fi
          SHORT_VERSION="${VERSION#v}"
          BUILD_NUMBER=$(grep 'CURRENT_PROJECT_VERSION' Nook.xcodeproj/project.pbxproj \
            | head -n1 | grep -oE '[0-9]+' | tail -n1)
          case "$SHORT_VERSION" in
            *-beta.*) IS_BETA=true;  DISPLAY_VERSION="${SHORT_VERSION%%-beta.*} beta ${SHORT_VERSION##*-beta.}" ;;
            *)        IS_BETA=false; DISPLAY_VERSION="$SHORT_VERSION" ;;
          esac
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "SHORT_VERSION=$SHORT_VERSION" >> $GITHUB_ENV
          echo "DISPLAY_VERSION=$DISPLAY_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "IS_BETA=$IS_BETA" >> $GITHUB_ENV
          echo "Building $DISPLAY_VERSION ($SHORT_VERSION, build $BUILD_NUMBER)"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          printf "%s" "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > signing_certificate.p12

          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain

          security import signing_certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign

          security list-keychains -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain

          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | grep "Developer ID Application" | head -n1 | awk '{print $2}')
          echo "SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
          echo "Using signing identity: $IDENTITY"

      - name: Ensure Metal Toolchain
        run: xcodebuild -downloadComponent MetalToolchain || echo "Metal Toolchain already present or download unsupported, continuing"

      - name: Refresh bundled filter lists
        run: ./scripts/refresh-filter-lists.sh

      - name: Build app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e
          mkdir -p build
          # CI entitlements omit push/autofill which require provisioning profiles.
          # The re-sign step applies the full entitlements before notarization.
          ENTITLEMENTS="$(pwd)/Nook/Nook-CI.entitlements"
          # Apple Silicon only: deployment target is macOS 26 and MLX has no x86_64 slice.
          xcodebuild -scheme Nook -configuration Release \
            -arch arm64 \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$SHORT_VERSION" \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_CODE_COVERAGE=NO \
            CLANG_COVERAGE_MAPPING=NO
          cp -R "build/Build/Products/Release/Nook.app" ./Nook.app

      - name: Re-sign for notarization
        run: |
          # Notarization requires all binaries to be signed with our Developer ID,
          # a secure timestamp, and hardened runtime. Sparkle ships pre-signed with
          # its own cert, so we must re-sign the entire bundle from inside out.
          SPARKLE="Nook.app/Contents/Frameworks/Sparkle.framework/Versions/B"

          # Sign innermost binaries first
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            "$SPARKLE/XPCServices/Downloader.xpc/Contents/MacOS/Downloader"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            "$SPARKLE/XPCServices/Installer.xpc/Contents/MacOS/Installer"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            "$SPARKLE/Updater.app/Contents/MacOS/Updater"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            "$SPARKLE/Autoupdate"

          # Sign bundles
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            "$SPARKLE/XPCServices/Downloader.xpc"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            "$SPARKLE/XPCServices/Installer.xpc"
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime \
            "$SPARKLE/Updater.app"

          # Sign the Sparkle dylib itself before signing the framework bundle
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp \
            "$SPARKLE/Sparkle"

          # Sign the framework version (Versions/B) — do NOT also sign the
          # top-level Sparkle.framework symlink; it resolves to the same Versions/B
          # directory and double-signing would invalidate the signature.
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp --options runtime "$SPARKLE"

          # Re-sign the main app with CI entitlements (omits aps-environment and
          # autofill-credential-provider which require a provisioning profile)
          codesign --force --sign "$SIGNING_IDENTITY" --timestamp \
            --options runtime \
            --entitlements "$(pwd)/Nook/Nook-CI.entitlements" \
            "Nook.app"

      - name: Verify signature before notarizing
        run: codesign --verify --deep --strict --verbose=2 "Nook.app"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "nook-notary" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

          # ditto preserves macOS symlinks and extended attributes; zip -r does not.
          # Broken symlinks in the archive cause "invalid signature" errors because
          # the bundle seal references symlink targets, not file copies.
          ditto -c -k --keepParent "Nook.app" Nook.zip
          SUBMIT_OUTPUT=$(xcrun notarytool submit "Nook.zip" \
            --keychain-profile "nook-notary" \
            --wait 2>&1)
          echo "$SUBMIT_OUTPUT"
          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "^  id:" | head -1 | awk '{print $2}')
          STATUS=$(echo "$SUBMIT_OUTPUT" | grep "^  status:" | awk '{print $2}')
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization rejected. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" --keychain-profile "nook-notary"
            exit 1
          fi

      - name: Staple notarization ticket
        run: xcrun stapler staple "Nook.app"

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 "Nook.app"
          spctl --assess --type execute --verbose "Nook.app"

      - name: Create DMG
        run: |
          hdiutil create -volname "Nook $DISPLAY_VERSION" \
            -srcfolder "Nook.app" \
            -ov -format UDZO "Nook-${VERSION}.dmg"

      - name: Sign DMG for Sparkle
        env:
          SPARKLE_SIGNING_KEY: ${{ secrets.SPARKLE_SIGNING_KEY }}
        run: |
          SIGN_OUTPUT=$(echo "$SPARKLE_SIGNING_KEY" | build/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update "Nook-${VERSION}.dmg" --ed-key-file -)
          # Output is like: sparkle:edSignature="..." length="..."
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          DMG_LENGTH=$(echo "$SIGN_OUTPUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')
          echo "ED_SIGNATURE=$ED_SIGNATURE" >> $GITHUB_ENV
          echo "DMG_LENGTH=$DMG_LENGTH" >> $GITHUB_ENV

      - name: Create GitHub Release and upload DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the release (or update if it already exists). Betas are prereleases
          # and say so at the top of their notes.
          if [ "$IS_BETA" = "true" ]; then
            PRERELEASE="--prerelease"
            printf 'This is a beta build. Use it, and report what breaks in Issues.\n\n' > notes.md
          else
            PRERELEASE=""
            : > notes.md
          fi
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            $PRERELEASE \
            "Nook-${VERSION}.dmg" \
          || gh release upload "$VERSION" "Nook-${VERSION}.dmg" --clobber

      - name: Update appcast on gh-pages
        run: |
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/Nook-${VERSION}.dmg"
          DATE=$(date -R)

          # The filter-list refresh step left tracked files modified; drop that so the
          # branch switch is not refused.
          git checkout -- .
          git fetch origin gh-pages
          git checkout gh-pages

          # Builds below 110 (the 1.0.x line, bundle id io.browsewithnook.nook, signed by another
          # team) cannot install our updates: Sparkle binds an update to the running app's Team ID.
          # The informational scope shows them a link instead. Keep it on every item.
          ENTRY=$(cat << XMLEOF
            <item>
              <title>Version ${DISPLAY_VERSION}</title>
              <link>https://github.com/${{ github.repository }}/releases/tag/${VERSION}</link>
              <sparkle:releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/${VERSION}</sparkle:releaseNotesLink>
              <sparkle:informationalUpdate>
                <sparkle:belowVersion>110</sparkle:belowVersion>
              </sparkle:informationalUpdate>
              <pubDate>${DATE}</pubDate>
              <enclosure
                url="${DMG_URL}"
                sparkle:version="${BUILD_NUMBER}"
                sparkle:shortVersionString="${SHORT_VERSION}"
                sparkle:edSignature="${ED_SIGNATURE}"
                length="${DMG_LENGTH}"
                type="application/octet-stream"/>
            </item>
          XMLEOF
          )

          python3 -c "import sys; content = open('appcast.xml').read(); entry = sys.argv[1]; content = content.replace('</channel>', entry + '\n</channel>', 1); open('appcast.xml', 'w').write(content)" "$ENTRY"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Release ${VERSION}"
          git push origin gh-pages
